<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin sign in — BookEasy</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { background: #0f172a; }
    .admin-login-card {
      max-width: 420px; margin: 8vh auto;
      background: #1e293b; color: #e2e8f0;
      border-radius: 16px; padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .admin-login-card h1 { color: #fff; font-size: 1.5rem; margin-bottom: 0.25rem; }
    .admin-login-card p.sub { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }
    .admin-login-card label { color: #cbd5e1; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .admin-login-card .form-control {
      background: #0f172a; border-color: #334155; color: #fff;
    }
    .admin-login-card .form-control:focus {
      background: #0f172a; color: #fff; border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }
    .admin-login-card .input-group-text {
      background: #0f172a; border-color: #334155; color: #94a3b8;
    }
    .admin-login-card .shield {
      width: 64px; height: 64px; margin: 0 auto 1rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; color: #fff;
      box-shadow: 0 8px 24px rgba(102,126,234,0.4);
    }
    .admin-login-card .footer-note {
      text-align: center; color: #64748b; font-size: 0.75rem; margin-top: 1.5rem;
    }
    .admin-login-card .footer-note a { color: #94a3b8; }
    .admin-login-card .alert { border-radius: 10px; font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <div class="admin-login-card">
      <div class="shield">🛡️</div>
      <h1 class="text-center">Admin access</h1>
      <p class="sub text-center">Sign in with your administrator account</p>

      <div id="alert-slot"></div>

      <form id="admin-login-form">
        <div class="mb-3">
          <label for="email">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input id="email" type="email" class="form-control" required autocomplete="username"
                   placeholder="admin@bookeasy.demo" />
          </div>
        </div>
        <div class="mb-4">
          <label for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input id="password" type="password" class="form-control" required autocomplete="current-password"
                   placeholder="••••••••" />
          </div>
        </div>

        <button id="submit-btn" type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
          <i class="bi bi-shield-lock me-2"></i>Sign in to admin
        </button>
      </form>

      <div class="footer-note">
        Not an administrator? <a href="/login.html">Customer sign in →</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { adminLogin, adminAuth, $, toast } from '/js/api.js';

    // Bootstrap Icons
    if (!document.querySelector('link[href*="bootstrap-icons"]')) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css';
      document.head.appendChild(l);
    }

    // If already signed in as admin, redirect
    if (adminAuth.isLoggedIn) {
      const next = new URLSearchParams(location.search).get('next');
      location.href = next || '/admin.html';
    }

    const form = $('#admin-login-form');
    const btn  = $('#submit-btn');
    const alertSlot = $('#alert-slot');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertSlot.innerHTML = '';

      const email = $('#email').value.trim().toLowerCase();
      const password = $('#password').value;

      btn.disabled = true;
      const oldHtml = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating…';

      try {
        const res = await adminLogin({ email, password });

        // Verify the response actually contains admin audience
        if (res.audience !== 'admin') {
          throw new Error('Unexpected token audience');
        }

        adminAuth.save({
          accessToken:  res.accessToken,
          refreshToken: res.refreshToken,
          user:         res.user,
        });

        toast('Welcome back, admin', 'success');
        const next = new URLSearchParams(location.search).get('next');
        setTimeout(() => {
          location.href = next || '/admin.html';
        }, 400);

      } catch (err) {
        let message = err.message || 'Sign-in failed';
        if (err.status === 423) message = err.data?.message || 'Account locked';
        if (err.status === 403) message = err.data?.message || 'Access denied';

        alertSlot.innerHTML = `
          <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-1"></i>${message}
          </div>`;
        btn.disabled = false;
        btn.innerHTML = oldHtml;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage business — BookEasy</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="py-5">
    <div class="container">
      <div id="app">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderLayout } from '/js/layout.js';
    import { requireAuth, auth, api, getMyBusinesses, $, fmtMoney, toast } from '/js/api.js';

    renderLayout({ active: 'dashboard' });
    if (!requireAuth()) throw new Error('redirected');
    if (auth.user.role !== 'business_owner') location.href = '/my-bookings.html';

    const root = document.getElementById('app');
    let business = null;
    let services = [];
    let staff    = [];

    boot();

    async function boot() {
      const { businesses } = await getMyBusinesses();
      if (!businesses.length) {
        root.innerHTML = `<div class="alert alert-warning">No business yet. <a href="/onboarding.html">Create one</a>.</div>`;
        return;
      }
      business = businesses[0];

      await Promise.all([loadServices(), loadStaff()]);
      render();
    }

    async function loadServices() {
      const data = await api(`/me/businesses/${business.id}/services`);
      services = data.services ?? [];
    }
    async function loadStaff() {
      const data = await api(`/me/businesses/${business.id}/staff`);
      staff = data.staff ?? [];
    }

    function render() {
      root.innerHTML = `
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
          <div>
            <h1 class="fw-bold mb-1">${business.name}</h1>
            <p class="text-secondary mb-0">Manage services and staff</p>
          </div>
          <a href="/dashboard.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Back to dashboard
          </a>
        </div>

        <!-- Staff -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">Staff (${staff.length})</h5>
              <button class="btn btn-sm btn-primary" id="add-staff">
                <i class="bi bi-plus-lg me-1"></i>Add staff
              </button>
            </div>
            ${staff.length ? `
              <ul class="list-group list-group-flush">
                ${staff.map(s => `
                  <li class="list-group-item d-flex align-items-center gap-3 px-0">
                    <div class="rounded-circle bg-primary bg-opacity-10 text-primary
                                d-flex align-items-center justify-content-center fw-bold"
                         style="width:40px;height:40px;">
                      ${s.name.slice(0,1).toUpperCase()}
                    </div>
                    <div class="flex-grow-1">
                      <div class="fw-semibold">${s.name}</div>
                      <div class="small text-secondary">${s.email || 'No email'}</div>
                    </div>
                  </li>
                `).join('')}
              </ul>
            ` : '<p class="text-secondary mb-0">No staff yet. Add at least one to accept bookings.</p>'}
          </div>
        </div>

        <!-- Services -->
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">Services (${services.length})</h5>
              <button class="btn btn-sm btn-primary" id="add-service">
                <i class="bi bi-plus-lg me-1"></i>Add service
              </button>
            </div>
            ${services.length ? `
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr><th>Name</th><th>Duration</th><th>Price</th><th>Status</th><th></th></tr>
                  </thead>
                  <tbody>
                    ${services.map(s => `
                      <tr>
                        <td>
                          <div class="fw-semibold">${s.name}</div>
                          <div class="small text-secondary">${s.description || ''}</div>
                        </td>
                        <td>${s.duration_minutes} min</td>
                        <td>${fmtMoney(s.price)}</td>
                        <td>
                          <span class="badge ${s.is_active ? 'text-bg-success' : 'text-bg-secondary'}">
                            ${s.is_active ? 'Active' : 'Inactive'}
                          </span>
                        </td>
                        <td class="text-end">
                          <button class="btn btn-sm btn-outline-danger" data-del="${s.id}">
                            <i class="bi bi-trash"></i>
                          </button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<p class="text-secondary mb-0">No services yet. Add one so customers can book.</p>'}
          </div>
        </div>
      `;

      document.getElementById('add-staff').onclick = addStaff;
      document.getElementById('add-service').onclick = addService;
      document.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = () => deleteService(btn.dataset.del);
      });
    }

    async function addStaff() {
      const name = prompt('Staff name:');
      if (!name) return;
      try {
        await api(`/me/businesses/${business.id}/staff`, {
          method: 'POST',
          body: JSON.stringify({ name }),
        });
        toast('Staff added', 'success');
        await loadStaff(); render();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function addService() {
      const name = prompt('Service name:');
      if (!name) return;
      const price = prompt('Price (NGN):', '2500');
      if (!price) return;
      const duration = prompt('Duration (minutes):', '30');
      if (!duration) return;
      if (!staff.length) { toast('Add a staff member first', 'error'); return; }

      try {
        await api(`/me/businesses/${business.id}/services`, {
          method: 'POST',
          body: JSON.stringify({
            name,
            price: Number(price),
            duration_minutes: Number(duration),
            staff_ids: staff.map(s => s.id),
          }),
        });
        toast('Service added', 'success');
        await loadServices(); render();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function deleteService(id) {
      if (!confirm('Remove this service?')) return;
      try {
        await api(`/me/businesses/${business.id}/services/${id}`, { method: 'DELETE' });
        toast('Service removed', 'success');
        await loadServices(); render();
      } catch (e) { toast(e.message, 'error'); }
    }
  </script>
</body>
</html>

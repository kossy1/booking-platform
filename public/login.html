<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — BookEasy</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="py-5">
    <div class="container">
      <div class="card border-0 shadow-lg auth-card" data-aos="fade-up">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 text-primary mb-3"
                 style="width:64px;height:64px;font-size:1.75rem;">
              <i class="bi bi-person"></i>
            </div>
            <h1 class="fw-bold h3 mb-1">Welcome back</h1>
            <p class="text-secondary mb-0">Sign in to manage your bookings</p>
          </div>

          <div id="alert-slot"></div>

          <form id="login-form">
            <div class="mb-3">
              <label for="email" class="form-label small fw-semibold">Email</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-secondary"></i></span>
                <input id="email" type="email" class="form-control" required placeholder="you@example.com" autocomplete="email" />
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock text-secondary"></i></span>
                <input id="password" type="password" class="form-control" required placeholder="••••••••" autocomplete="current-password" />
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" checked />
                <label class="form-check-label small" for="remember">Remember me</label>
              </div>
              <a href="#" class="small text-decoration-none">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
            </button>
          </form>

          <p class="text-center small text-secondary mt-4 mb-0">
            Don't have an account?
            <a href="/register.html" class="fw-semibold text-decoration-none">Create one</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderLayout } from '/js/layout.js';
    import { login, auth, $, toast } from '/js/api.js';

    renderLayout();

    // Already logged in? Bounce.
    if (auth.isLoggedIn) {
      const next = new URLSearchParams(location.search).get('next');
      location.href = next || (auth.user.role === 'business_owner' ? '/dashboard.html' : '/my-bookings.html');
    }

    const form       = $('#login-form');
    const alertSlot  = $('#alert-slot');
    const btn        = form.querySelector('button[type=submit]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertSlot.innerHTML = '';

      const email    = $('#email').value.trim().toLowerCase();
      const password = $('#password').value;

      btn.disabled = true;
      const oldHtml = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';

      try {
        const res = await login({ email, password });
        auth.save({
          accessToken:  res.accessToken,
          refreshToken: res.refreshToken,
          user:         res.user,
        });

        toast('Welcome back!', 'success');

        const next = new URLSearchParams(location.search).get('next');
        setTimeout(() => {
          location.href = next || (res.user.role === 'business_owner' ? '/dashboard.html' : '/my-bookings.html');
        }, 400);

      } catch (err) {
        alertSlot.innerHTML = `
          <div class="alert alert-danger d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle"></i>
            <span>${err.message || 'Sign-in failed'}</span>
          </div>`;
        btn.disabled = false;
        btn.innerHTML = oldHtml;
      }
    });
  </script>
</body>
</html>
